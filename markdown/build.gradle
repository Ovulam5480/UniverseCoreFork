apply plugin: 'java'

sourceSets.main.java.srcDirs = ["src/main/java"]
sourceSets.test.java.srcDirs = ["src/test/java"]

repositories{
    mavenCentral()
    mavenLocal()
    maven { url 'https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository' }
    maven { url 'https://maven.xpdustry.com/mindustry' }
    maven{ url 'https://www.jitpack.io' }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.github.EB-wilson.UniverseCore'
            artifactId = 'markdown'
            version = "$uncVersion"
            from components.java
        }
    }
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile){
    options.compilerArgs.addAll(['--release', '17'])
}

dependencies {
    implementation 'org.commonmark:commonmark:0.20.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.20.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.20.0'
    implementation 'org.commonmark:commonmark-ext-ins:0.20.0'

    compileOnly "com.github.Anuken.Arc:arc-core:$arcVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    testRuntimeOnly "com.github.Anuken.Arc:arc-core:$arcVersion"
    testRuntimeOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    compileOnly("org.jetbrains:annotations:24.0.0")

    annotationProcessor project(":annotations")
}

tasks.test {
    useJUnitPlatform()
}